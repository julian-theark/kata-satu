  const go = document.getElementById("go");
  if (go) go.onclick = () => { atHome = false; render(); };
  document.getElementById("words").onclick = wordsScreen;
  document.getElementById("prog").onclick = progressScreen;
  const prac = document.getElementById("prac");
  if (prac) prac.onclick = () => startPractice(6);

  animateHome();
}

function homeLinks() {
  const can = practicePool().length;
  return (can ? '<button class="btn btn-ghost btn-sm" id="prac">Practice both ways</button>' : "") +
  '<div class="links">' +
    '<button class="link" id="words">My words</button>' +
    '<span class="dot">\u00b7</span>' +
    '<button class="link" id="prog">Progress</button>' +
  '</div>';
}

// ── progress ─────────────────────────────────────────────────────────────────
// Everything measurable lives here, one tap away, so the home screen can stay
// about the word.
function progressScreen() {
  const st = stats(STATE, VOCAB, dayKey);
  const fc = forecast(14);
  const growth = growthChart();
  const lv = levelFor(totalXp());

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="title">Progress</div>' +

      '<div class="lvl" style="margin-top:20px">' +
        '<div class="lvl-top"><span>Level ' + lv.level + '</span>' +
          '<span class="num">' + lv.into + ' / ' + lv.span + '</span></div>' +
        '<div class="track"><i style="width:' + Math.round(lv.fraction * 100) + '%"></i></div>' +
      '</div>' +

      '<div class="tiles">' +
        tile(st.streak, "", "Day streak") +
        tile(st.longest, "", "Best streak") +
        tile(st.introduced, " of " + st.total, "Words seen") +
        tile(st.reviewsCompleted, "", "Reviews") +
      '</div>' +

      (STATE.totals.practiceAnswers
        ? '<div class="meta" style="margin-top:14px">Plus ' + STATE.totals.practiceAnswers +
          ' practice answers \u00b7 ' +
          Math.round((STATE.totals.practiceCorrect / STATE.totals.practiceAnswers) * 100) +
          '% right</div>'
        : "") +

      figure("Reviews ahead", "next 14 days",
        barChart(fc, { label: "Reviews due over the next fourteen days" }),
        '<span id="fcap">' + fcCaption(fc) + '</span>') +

      figure("The ladder", "where your words sit", stageBar(),
        "Each word climbs: recognise it, produce it, recall it, say it, own it.") +

      (growth ? figure("Words seen", "last 30 days", growth, "") : "") +

      figure("Turning up", "8 weeks", heatGrid(), "") +

      badges(st) +
    '</div>';

  act('<button class="btn btn-primary" id="back">Done</button>');
  document.getElementById("back").onclick = () => { atHome = true; rebuild(); render(); };
  wireChart(fc);
}

// Everything is already in its finished position in the markup; this only adds
// the arrival. A reduced-motion setting skips straight to the end state.
function animateHome() {
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const num = stage.querySelector("[data-count]");
  const target = num ? +num.dataset.count : 0;
  if (!num) return;
  if (reduce || target === 0) { num.textContent = String(target); return; }

  const t0 = performance.now(), ms = 650;
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    num.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Milestones, not trophies: each one names a real threshold in the method.
function fcCaption(fc) {
  const total = fc.reduce((n, d) => n + d.n, 0);
  const peak = fc.reduce((a, b) => (b.n > a.n ? b : a), fc[0]);
  if (!total) return "Nothing due in the next fortnight.";
  return total + " review" + (total === 1 ? "" : "s") + " due \u00b7 busiest day " +
         niceDay(peak.key) + " with " + peak.n;
}

function niceDay(key) {
  const d = parseKey(key);
  const names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return key === dayKey ? "today" : names[d.getDay()] + " " + d.getDate();
}

// Touch a bar and the caption under the chart names that day. Steadier on a
// phone than a floating tooltip, and it cannot fall off the screen edge.
function wireChart(fc) {
  const cap = document.getElementById("fcap");
  const svg = stage.querySelector(".chart");
  if (!cap || !svg) return;
  const base = cap.textContent;
  const show = e => {
    const bar = e.target.closest(".bar");
    if (!bar) return;
    const d = fc[+bar.dataset.i];
    cap.textContent = niceDay(d.key) + " \u00b7 " + (d.n || "nothing") +
      (d.n ? (d.n === 1 ? " review" : " reviews") : " due");
    stage.querySelectorAll(".bar").forEach(b => b.classList.toggle("hot", b === bar));
  };
  const clear = () => {
    cap.textContent = base;
    stage.querySelectorAll(".bar").forEach(b => b.classList.remove("hot"));
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", clear);
}

function badges(st) {
  const list = [
    ["First word", st.introduced >= 1],
    ["7-day streak", st.longest >= 7],
    ["10 mastered", st.mastered >= 10],
    ["100 reviews", st.reviewsCompleted >= 100],
    ["30-day streak", st.longest >= 30],
    ["100 words", st.introduced >= 100]
  ];
  return '<div class="badges">' + list.map(b =>
    '<span class="pill' + (b[1] ? " pill-accent" : "") + '">' +
    (b[1] ? "\u2713 " : "") + b[0] + '</span>').join("") + '</div>';
}

// ── fx ───────────────────────────────────────────────────────────────────────
// No particles. A correct answer is marked by the answer itself swelling and
// the badge landing; anything thrown over the top of that is noise.
function reduceMotion() {
  try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; }
}

// A milestone lifts the whole screen for a moment; a miss gives it a shiver.
function flash(kind) {
  if (reduceMotion()) return;
  document.body.classList.remove("flash-win", "flash-miss");
  void document.body.offsetWidth;                    // restart the animation
  document.body.classList.add(kind === "miss" ? "flash-miss" : "flash-win");
  setTimeout(() => document.body.classList.remove("flash-win", "flash-miss"), 700);
}

// Every word ships with a memory hook — a sound-alike, a root, or a picture.
// They are written to be read in a second, not admired. You can replace any of
// them with your own from the word list; yours always wins.
function hookFor(id) {
  const mine = STATE.mnemonics && STATE.mnemonics[id];
  return mine || (typeof HOOKS !== "undefined" ? HOOKS[id] : null) || null;
}

function isMyHook(id) {
  return !!(STATE.mnemonics && STATE.mnemonics[id]);
}

// ── typed cards ──────────────────────────────────────────────────────────────
// A word that has survived multiple choice is tested by hand: the prompt on the
// front, your answer typed, then the card turns and shows the back. Typing is a
// different act from picking — it is the first time the app asks you to produce
// the word rather than recognise it.

// Marking is forgiving on everything that is not the word: case, accents,
// articles, bracketed glosses, and the "·" the vocabulary uses to separate
// several senses. Any one sense counts.
function normAnswer(t) {
  return String(t || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/\(.*?\)/g, " ")
    .replace(/^(to|the|a|an)\s+/g, "")
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function acceptableAnswers(q) {
  const raw = q.dir === "id_en" ? q.en : q.word;
  // Any one sense counts — and so does the whole gloss as printed on the card's
  // back, which is what someone copying the card would naturally type.
  const parts = raw.split(/[·,;/]| or /).map(normAnswer);
  return parts.concat([normAnswer(raw)]).filter(Boolean);
}

// One typo in a longer word should not count as not knowing it.
function closeEnough(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  if (b.length < 5) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;
    else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}

function markTyped(q, typed) {
  const given = normAnswer(typed);
  if (!given) return "wrong";
  const want = acceptableAnswers(q);
  if (want.some(w => w === given)) return "right";
  if (want.some(w => closeEnough(given, w))) return "close";
  return "wrong";
}

function cardScreen(q, onGrade, onNext) {
  const prompt = q.dir === "id_en" ? q.word : q.en;
  const answer = q.dir === "id_en" ? q.en : q.word;
  const mem = hookFor(q.id);

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="label">Write it \u00b7 ' + (q.dir === "id_en" ? "ID \u2192 EN" : "EN \u2192 ID") + '</div>' +
      '<div class="flip" id="flip">' +
        '<div class="flip-in">' +
          '<div class="face front">' +
            '<div class="facelabel">' + (q.dir === "id_en" ? "Indonesian" : "English") + '</div>' +
            '<div class="faceword">' + esc(prompt) + '</div>' +
            (mem ? '<div class="memo">' + esc(mem) + '</div>' : '') +
          '</div>' +
          '<div class="face back">' +
            '<div class="facelabel">' + (q.dir === "id_en" ? "English" : "Indonesian") + '</div>' +
            '<div class="faceword">' + esc(answer) + '</div>' +
            '<div class="faceex">' + hl(q.ex, q.word) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<input class="input typed" id="typed" type="text" autocomplete="off" ' +
        'autocapitalize="none" autocorrect="off" spellcheck="false" ' +
        'placeholder="Type the ' + (q.dir === "id_en" ? "meaning" : "word") + '">' +
      '<div class="meta" id="tmsg"></div>' +
    '</div>';

  act('<button class="btn btn-primary" id="check">Check</button>');

  const input = document.getElementById("typed");
  const msg = document.getElementById("tmsg");
  setTimeout(() => { try { input.focus(); } catch (e) {} }, 80);

  const settle = verdict => {
    const ok = verdict !== "wrong";
    document.getElementById("flip").classList.add("turned");
    input.disabled = true;
    input.classList.add(ok ? "ok" : "no");
    msg.innerHTML = verdict === "right" ? '<span class="verdict ok">Correct</span>'
      : verdict === "close" ? '<span class="verdict ok">Close enough \u2014 ' + esc(answer) + '</span>'
      : '<span class="verdict no">Not quite \u2014 ' + esc(answer) + '</span>';

    // Graded here, not after Continue: the badge has to appear beside the
    // result, and a screen that is about to be replaced cannot show one.
    let graded = ok;
    const badge = onGrade(ok);
    cheer(badge);
    if (ok && badge && badge.big) flash("win");
    else if (!ok) flash("miss");

    act('<button class="btn btn-primary" id="cnext">Continue</button>' +
        (ok ? "" : '<button class="btn btn-ghost btn-sm" id="iknew">I had it right</button>'));
    document.getElementById("cnext").onclick = () => onNext(graded);

    const iknew = document.getElementById("iknew");
    // Typed marking cannot know every synonym in the language; the override is
    // honest about that rather than pretending the dictionary is complete.
    if (iknew) iknew.onclick = () => {
      graded = true;
      const again = onGrade(true, true);          // re-grade as correct
      stage.querySelectorAll(".cheer").forEach(el => el.remove());
      cheer(again);
      iknew.remove();
      msg.innerHTML = '<span class="verdict ok">Counted as right</span>';
    };
  };

  const check = () => {
    if (input.disabled) return;
    settle(markTyped(q, input.value));
  };
  document.getElementById("check").onclick = check;
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
}

// ── mnemonics ────────────────────────────────────────────────────────────────
// After three misses a word is not going to fix itself by being shown again.
// This is where you write the hook that makes it stick — in your own words,
// because a mnemonic someone else wrote is just another thing to memorise.
const MNEMONIC_AFTER = 3;

// After three misses the word gets its own screen, so the hook is read rather
// than skimmed past under a wrong answer.
function needsMnemonic(id) {
  const c = STATE.cards[id];
  if (!c || c.known) return false;
  if (!hookFor(id)) return false;
  return (c.wrong || 0) >= MNEMONIC_AFTER;
}

function mnemonicScreen(id, onDone) {
  const v = byId(VOCAB)[id];
  const c = STATE.cards[id] || { wrong: 0 };
  const hook = hookFor(id) || "";
  const slipping = (c.wrong || 0) >= MNEMONIC_AFTER;
  let editing = false;

  const draw = () => {
    stage.innerHTML =
      '<div class="screen">' +
        '<div class="label">Memory hook</div>' +
        '<div class="hero" style="font-size:38px; margin-top:12px">' + esc(v.word) + '</div>' +
        '<div class="gloss">' + esc(v.en) + '</div>' +
        (slipping
          ? '<div class="meta" style="margin-top:10px">Missed ' + c.wrong +
            (c.wrong === 1 ? " time" : " times") + ' so far.</div>' : '') +
        (editing
          ? '<input class="input" id="memo" type="text" autocomplete="off" ' +
              'style="margin-top:20px" placeholder="Sounds like\u2026 / picture\u2026" ' +
              'value="' + esc(hookFor(id) || "") + '">'
          : '<div class="card" style="margin-top:20px"><div class="memo">' +
              esc(hook) + '</div></div>' +
            (isMyHook(id) ? '<div class="meta" style="margin-top:8px">Your own.</div>' : '')) +
      '</div>';

    act(editing
      ? '<button class="btn btn-primary" id="savememo">Save</button>' +
        '<button class="btn btn-ghost btn-sm" id="cancelmemo">Cancel</button>'
      : '<button class="btn btn-primary" id="gotit">Got it</button>' +
        '<button class="btn btn-ghost btn-sm" id="editmemo">' +
          (isMyHook(id) ? "Edit mine" : "Write my own") + '</button>');

    if (editing) {
      const input = document.getElementById("memo");
      setTimeout(() => { try { input.focus(); } catch (e) {} }, 80);
      document.getElementById("savememo").onclick = () => {
        const text = input.value.trim();
        STATE.mnemonics = STATE.mnemonics || {};
        if (text) STATE.mnemonics[id] = text.slice(0, 160);
        else delete STATE.mnemonics[id];          // cleared: back to the shipped hook
        save();
        onDone();
      };
      document.getElementById("cancelmemo").onclick = () => { editing = false; draw(); };
    } else {
      document.getElementById("gotit").onclick = onDone;
      document.getElementById("editmemo").onclick = () => { editing = true; draw(); };
    }
  };

  draw();
}

// ── practice ─────────────────────────────────────────────────────────────────
// Extra rounds, as many as you like, in both directions. Deliberately OUTSIDE
// the schedule: practice never changes a card's stage or due date. Spaced
// repetition works because the intervals are earned, and a keen evening would
// otherwise push every word out to sixty days on a day you happened to be sharp.
let practice = null;

function practicePool() {
  return Object.keys(STATE.cards).filter(id => {
    const c = STATE.cards[id];
    return c && !c.known && c.stage >= 2 && c.phase !== "done";
  });
}

// One question, built fresh each time: a new seed means new distractors and a
// new order, so a second round is not the same round again.
function practiceQuestion(id, dir, salt) {
  const vm = byId(VOCAB);
  const v = vm[id];
  const card = STATE.cards[id];
  if (!v || !card) return null;

  const rng = mulberry(hash32(id + "|" + dir + "|" + salt));
  const introduced = Object.keys(STATE.cards);
  const ds = distractors(VOCAB, v, introduced, rng, []);
  const opts = shuffle([v].concat(ds), rng);

  return {
    id: id, fmt: "mc", dir: dir,
    word: v.word, en: v.en, ex: v.ex, exEn: v.exEn, note: v.note || null,
    options: opts.map(o => ({ id: o.id, label: dir === "id_en" ? o.en : o.word })),
    answerIdx: opts.findIndex(o => o.id === v.id)
  };
}

function startPractice(size) {
  const pool = practicePool();
  if (!pool.length) return;

  // Weakest first, then a random slice of them: the words you keep missing come
  // up more often without the round becoming identical every time.
  const rng = mulberry(hash32(String(Date.now())));
  const ranked = pool
    .map(id => ({ id: id, w: scoreCard(STATE.cards[id], dayKey) + rng() * 3 }))
    .sort((a, b) => b.w - a.w)
    .slice(0, Math.max(size, Math.ceil(pool.length * 0.6)));
  const picked = shuffle(ranked.map(r => r.id), rng).slice(0, size);

  // Alternate the direction through the round, starting on a coin flip, so both
  // ways get tested in every session rather than one way for weeks.
  let flip = rng() < 0.5;
  practice = {
    queue: picked.map(id => {
      const dir = flip ? "id_en" : "en_id";
      flip = !flip;
      return practiceQuestion(id, dir, Date.now() + ":" + id);
    }).filter(Boolean),
    i: 0, right: 0, wrong: 0, size: size
  };
  renderPractice();
}

function renderPractice() {
  stage.classList.remove("centred");
  if (!practice || practice.i >= practice.queue.length) return practiceDone();

  const q = practice.queue[practice.i];
  const n = practice.i + 1, of = practice.queue.length;
  const ask = q.dir === "id_en"
    ? 'What does <em>' + esc(q.word) + '</em> mean?'
    : 'How do you say <em>' + esc(q.en) + '</em>?';

  pipsEl.innerHTML = practice.queue.map((_, k) =>
    '<i class="pip ' + (k < practice.i ? "done" : k === practice.i ? "now" : "") + '"></i>').join("");

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="label">Practice \u00b7 ' + n + ' of ' + of +
        ' \u00b7 ' + (q.dir === "id_en" ? "ID \u2192 EN" : "EN \u2192 ID") + '</div>' +
      '<div class="ask" style="margin-top:12px">' + ask + '</div>' +
      '<div class="opts">' +
      q.options.map((o, k) =>
        '<button class="opt" data-k="' + k + '"><span class="mark">\u25CF</span>' +
        '<span>' + esc(o.label) + '</span></button>').join("") +
      '</div>' +
    '</div>';
  act("");

  const opts = [...document.querySelectorAll(".opt")];
  let answered = false;
  opts.forEach(b => b.onclick = () => {
    if (answered) return;
    answered = true;
    const ok = +b.dataset.k === q.answerIdx;
    opts.forEach(o => { o.onclick = null; o.classList.add("dim"); });
    b.classList.remove("dim");
    b.classList.add(ok ? "right" : "shake");
    if (!ok) {
      b.classList.add("wrong");
      opts[q.answerIdx].classList.remove("dim");
      opts[q.answerIdx].classList.add("right");
    }

    if (ok) practice.right++; else practice.wrong++;
    STATE.totals.practiceAnswers = (STATE.totals.practiceAnswers || 0) + 1;
    if (ok) STATE.totals.practiceCorrect = (STATE.totals.practiceCorrect || 0) + 1;

    // Practice COUNTS: a word you get right here moves the three-in-a-row tally
    // and can graduate onto the written cards. What it cannot do is collect an
    // interval early — see grade(), where that rule lives.
    // The engine owns the rules about when an interval may move (see grade()):
    // practice just reports the answer.
    const card = STATE.cards[q.id];
    const phaseBefore = card && card.phase;
    if (card) grade(card, ok, dayKey, q.dir, q.fmt);
    save();

    stage.insertAdjacentHTML("beforeend",
      '<div class="verdict ' + (ok ? "ok" : "no") + '">' +
      (ok ? "Correct" : 'Not quite \u2014 <b class="hl">' + esc(q.word) + '</b> is ' + esc(q.en)) +
      '</div>');

    if (ok && graduatedJustNow(q.id, phaseBefore)) {
      cheer({ big: true, dots: dots(3, 3, 2), text: "3 of 3 \u00b7 written card tomorrow" });
      flash("win");
    } else if (ok) {
      cheer(cheerFor(q.id));
    } else {
      cheer(cheerMiss(q.id));
      flash("miss");
    }
    act('<button class="btn btn-primary" id="pnext">Continue</button>');
    document.getElementById("pnext").onclick = () => {
      // Practice is where most misses happen, so it is where the memory aid is
      // most worth offering.
      if (!ok && needsMnemonic(q.id))
        return mnemonicScreen(q.id, () => { practice.i++; renderPractice(); });
      practice.i++;
      renderPractice();
    };
  });
}

function practiceDone() {
  const total = practice.right + practice.wrong;
  const pct = total ? Math.round((practice.right / total) * 100) : 0;
  pipsEl.innerHTML = "";
  stage.classList.add("centred");
  stage.innerHTML =
    '<div class="screen">' +
      '<div class="label">Practice done</div>' +
      '<div class="hero">' + pct + '%</div>' +
      '<div class="gloss">' + practice.right + ' of ' + total + ' both ways</div>' +
      '<div class="meta" style="margin-top:22px">Practice counts towards three in a row. ' +
        'A word\u2019s next date still only moves once a day, however many rounds you do.</div>' +
    '</div>';
  act('<button class="btn btn-primary" id="again">Practice again</button>' +
      '<button class="btn btn-ghost btn-sm" id="pdone">Back</button>');
  document.getElementById("again").onclick = () => startPractice(practice.size);
  document.getElementById("pdone").onclick = () => { practice = null; atHome = true; rebuild(); render(); };
}

// ── what you are learning ────────────────────────────────────────────────────
// A word you cannot see is a word you cannot rehearse on the way to the shop.
// This is the whole day plus everything currently in flight, newest first.
function wordsScreen() {
  const vm = byId(VOCAB);
  const day = STATE.days[dayKey] || { newIds: [], reviewIds: [], answered: {} };
  const answered = day.answered || {};

  const todayRows = []
    .concat((day.newIds || []).map(id => ({ id: id, tag: "new" })))
    .concat((day.reviewIds || []).map(id => ({
      id: id, tag: id in answered ? (answered[id] ? "right" : "wrong") : "due"
    })));

  // In flight: introduced, not parked, not finished. Soonest due first, so the
  // list reads as "what is coming back at me".
  const learning = Object.keys(STATE.cards)
    .filter(id => { const c = STATE.cards[id]; return c && !c.known && !isMastered(c) && c.phase !== "done"; })
    .sort((a, b) => (STATE.cards[a].next || "").localeCompare(STATE.cards[b].next || ""));

  const line = (id, right) => {
    const v = vm[id];
    if (!v) return "";
    const memo = hookFor(id);
    return '<div class="wrow" data-id="' + id + '">' +
             '<div class="wword">' + esc(v.word) +
               '<small>' + esc(v.en) + '</small>' +
               (memo ? '<em class="wmemo' + (isMyHook(id) ? " mine" : "") + '">' +
                       esc(memo) + '</em>' : '') +
             '</div>' +
             '<div class="wmeta">' + right + '</div>' +
           '</div>';
  };

  const badge = tag =>
    tag === "new"   ? '<span class="pill pill-accent">new today</span>' :
    tag === "right" ? '<span class="pill pill-accent">\u2713</span>' :
    tag === "wrong" ? '<span class="pill pill-neg">missed</span>' :
                      '<span class="pill">due</span>';

  const when = id => {
    const c = STATE.cards[id];
    if (!c) return "";
    const d = daysBetween(dayKey, c.next);
    const label = d <= 0 ? "due now" : d === 1 ? "tomorrow" : "in " + d + " days";
    return '<span class="pill">' + label + '</span>';
  };

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="title">Your words</div>' +

      '<div class="label label-quiet" style="margin-top:22px">Today</div>' +
      (todayRows.length
        ? '<div class="wlist">' + todayRows.map(r => line(r.id, badge(r.tag))).join("") + '</div>'
        : '<div class="meta" style="margin-top:8px">Nothing scheduled today.</div>') +

      '<div class="label label-quiet" style="margin-top:26px">Still learning \u00b7 ' +
        learning.length + '</div>' +
      (learning.length
        ? '<div class="wlist">' + learning.map(id => line(id, when(id))).join("") + '</div>'
        : '<div class="meta" style="margin-top:8px">Nothing in flight yet.</div>') +
    '</div>';

  act('<button class="btn btn-primary" id="back">Done</button>');
  document.getElementById("back").onclick = () => { atHome = true; rebuild(); render(); };

  // Tap any word to read its memory hook, or replace it with your own.
  stage.querySelectorAll(".wrow").forEach(row => row.onclick = () => {
    mnemonicScreen(row.dataset.id, wordsScreen);
  });
}

// ── settings ─────────────────────────────────────────────────────────────────
document.getElementById("gear").onclick = settings;
dayEl.onclick = wordsScreen;

function settings() {
  const s = STATE.settings;
  const st = stats(STATE, VOCAB, dayKey);
  pipsEl.innerHTML = "";

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="title">Settings</div>' +

      '<div class="label label-quiet" style="margin-top:22px">Accent</div>' +
      '<div class="set"><label>Colour</label><div class="swatches" id="sw">' +
        Object.keys(ACCENTS).map(k =>
          '<button class="sw" data-k="' + k + '" aria-pressed="' +
          (s.accentPreset === k ? "true" : "false") + '" aria-label="' + k +
          '" style="background:' + ACCENTS[k].base + '"></button>').join("") +
      '</div></div>' +

      '<div class="label label-quiet" style="margin-top:22px">Daily load</div>' +
      seg("Reviews", "reviewsPerDay", [[1, "1"], [2, "2"], [3, "3"], [5, "5"]]) +
      seg("Asking", "direction", [["adaptive", "Auto"], ["both", "Both"],
                                  ["id_en", "ID\u2192EN"], ["en_id", "EN\u2192ID"]]) +

      '<div class="label label-quiet" style="margin-top:22px">Storage</div>' +
      storageBlock() +

      '<div class="meta" style="margin-top:22px">Day ' + st.dayNumber + ' \u00b7 ' +
        st.introduced + ' words in progress \u00b7 ' + st.known + ' parked.<br>' +
        'A changed daily load takes effect tomorrow.</div>' +
      '<div class="meta" style="margin-top:18px">Build ' +
        (typeof BUILD === "string" ? BUILD : "\u2014") + '</div>' +
      '<div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-sm" id="refresh">Force update</button>' +
        '<button class="btn btn-danger btn-sm" id="reset">Reset all progress</button>' +
      '</div>' +
    '</div>';

  act('<button class="btn btn-primary" id="back">Done</button>');
  document.getElementById("back").onclick = () => { atHome = true; rebuild(); render(); };

  stage.querySelectorAll("#sw .sw").forEach(b => b.onclick = () => {
    STATE.settings.accentPreset = b.dataset.k;
    save();
    applyAccent();                       // the tokens change; nothing is replaced
    stage.querySelectorAll("#sw .sw").forEach(x =>
      x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  });
  stage.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const key = b.dataset.key;
    let v = b.dataset.v;
    if (/^\d+$/.test(v)) v = +v;
    STATE.settings[key] = v;
    save();

    // Slide the thumb and repaint the labels in place. Re-rendering the screen
    // would replace the element mid-transition, which is what made this feel
    // like a jump rather than a movement.
    const seg = b.parentElement;
    const buttons = [...seg.querySelectorAll("button")];
    seg.style.setProperty("--seg-i", buttons.indexOf(b));
    buttons.forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    // Today's plan is left alone on purpose: rebuilding it would throw away the
    // answers already recorded against it. A changed load starts tomorrow.
  });

  const pairBtn = document.getElementById("pair");
  if (pairBtn) pairBtn.onclick = async () => {
    const endpoint = document.getElementById("ep").value.trim();
    const token = document.getElementById("tk").value.trim();
    const profile = document.getElementById("who").value.trim();
    const msg = document.getElementById("pairmsg");
    if (!endpoint || !token) { msg.textContent = "Both the URL and the token are needed."; return; }
    pairBtn.disabled = true;
    msg.textContent = "Checking\u2026";
    const keep = SHEET;
    SHEET = { endpoint: endpoint, token: token, profile: profile };
    try {
      await sheetCall("ping", {});
      const remote = await sheetPull();
      writeSheetCreds(SHEET);
      sheetState = "ok";
      if (remote && newer(remote, STATE)) { STATE = merge(remote); applyAccent(); }
      else await sheetPush(STATE);
      settings();
    } catch (e) {
      SHEET = keep;
      pairBtn.disabled = false;
      msg.textContent = "Could not reach that backend \u2014 check the URL and token.";
    }
  };

  const unpair = document.getElementById("unpair");
  if (unpair) unpair.onclick = () => {
    writeSheetCreds(null);
    sheetState = "off";
    settings();
  };

  // An installed web app can get stuck on a cached copy of itself. This throws
  // away the service worker and every cache, then reloads from the network.
  const refresh = document.getElementById("refresh");
  if (refresh) refresh.onclick = async function () {
    this.disabled = true;
    this.textContent = "Updating\u2026";
    try {
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if (navigator.serviceWorker) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (e) {}
    // Cache-busted so no layer in between can hand back the old page.
    location.replace(location.pathname + "?v=" + Date.now());
  };

  document.getElementById("reset").onclick = function () {
    if (this.dataset.armed !== "1") {
      this.dataset.armed = "1";
      this.textContent = "Tap again to erase everything";
      return;
    }
    const keep = STATE.settings;
    STATE = defaultState();
    STATE.settings = keep;
    save();
    skipped = 0;
    start();
  };
}

// Where this copy saves, and how to point it at the gym app's spreadsheet.
function storageBlock() {
  // Inside claude.ai the account store is the backend; the Sheet pairing is for
  // the installed build, which has no account behind it.
  if (!SHEET && typeof claude !== "undefined")
    return '<div class="meta">Saved to your Claude account. It follows you to any ' +
           'device where you open this page signed in.</div>';
  if (DB) return '<div class="meta">Saved to your Claude account. It follows you to ' +
                 'any device where you open this page signed in.</div>';
  if (SHEET) {
    const word = sheetState === "error" ? "not reachable right now"
               : sheetState === "saving" ? "saving\u2026" : "in sync";
    return '<div class="set"><label>Google Sheet</label>' +
           '<span class="meta">' + word + '</span></div>' +
           (SHEET.profile ? '<div class="set"><label>Profile</label>' +
             '<span class="meta">' + esc(SHEET.profile) + '</span></div>' : '') +
           '<div class="meta" style="margin-top:10px">Progress is written to the same ' +
           'spreadsheet as NXT, under its own tab. This device also keeps a copy, so the ' +
           'app works offline.</div>' +
           '<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" id="unpair">Disconnect</button></div>';
  }
  return '<div class="meta">Saved on this device only. Connect it to the spreadsheet ' +
         'NXT already uses and your progress survives a new phone.</div>' +
         '<div class="pair">' +
           '<input class="input" id="ep" type="url" inputmode="url" autocomplete="off" ' +
             'placeholder="Apps Script web app URL">' +
           '<input class="input" id="tk" type="text" autocomplete="off" placeholder="App token">' +
           '<input class="input" id="who" type="text" autocomplete="off" ' +
             'placeholder="Your name (keeps progress separate)">' +
           '<button class="btn btn-primary btn-sm" id="pair">Connect</button>' +
           '<div class="meta" id="pairmsg"></div>' +
         '</div>';
}

// The thumb is one element that slides, rather than two backgrounds swapping:
// the movement is what makes a segmented control feel physical.
function seg(label, key, pairs) {
  const cur = STATE.settings[key];
  const i = Math.max(0, pairs.findIndex(p => String(p[0]) === String(cur)));
  return '<div class="set"><label>' + label + '</label>' +
    '<div class="seg" style="--seg-n:' + pairs.length + '; --seg-i:' + i + '">' +
      '<i class="seg-thumb"></i>' +
      pairs.map(p => '<button data-key="' + key + '" data-v="' + p[0] + '" aria-pressed="' +
        (String(cur) === String(p[0]) ? "true" : "false") + '">' + p[1] + '</button>').join("") +
    '</div></div>';
}

// iOS reads the Home Screen icon and app name from <head> at the moment you tap
// "Add to Home Screen", and the page body is not where it looks — so the tags
// are copied up on load.
// Launched from the Home Screen there is no browser chrome above the page, so
// the layout has to make room for the status bar itself.
(function standaloneLayout() {
  try {
    const installed = navigator.standalone === true ||
      (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (installed) document.documentElement.classList.add("standalone");
  } catch (e) {}
})();

(function homeScreenIcon() {
  try {
    const want = [
      ["link", { rel: "apple-touch-icon", href: "icon/apple-touch-icon.png" }],
      ["link", { rel: "icon", href: "icon/icon-192.png" }],
      ["meta", { name: "apple-mobile-web-app-title", content: "Kata Satu" }],
      ["meta", { name: "apple-mobile-web-app-capable", content: "yes" }],
      ["meta", { name: "apple-mobile-web-app-status-bar-style", content: "black" }],
      ["meta", { name: "theme-color", content: "#09090A" }]
    ];
    for (const [tag, attrs] of want) {
      const el = document.createElement(tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      document.head.appendChild(el);
    }
  } catch (e) {}
})();

// An installed web app can sit on a cached copy of itself for days. Rather than
// leaving that to the person using it, the page asks the server which build is
// current and, if it is behind, clears everything and reloads itself once.
async function checkForUpdate() {
  if (typeof BUILD !== "string" || BUILD.indexOf("__") === 0) return;
  try {
    const res = await fetch("version.json?cb=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const live = await res.json();
    if (!live || !live.build || live.build === BUILD) return;

    // Once per build, so a failed update can never become a reload loop.
    const seen = "kata-satu-tried-" + live.build;
    try { if (sessionStorage.getItem(seen)) return; sessionStorage.setItem(seen, "1"); } catch (e) {}

    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if (navigator.serviceWorker) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    location.replace(location.pathname + "?v=" + Date.now());
  } catch (e) {}
}

boot();
checkForUpdate();

</script>

<script>
if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
