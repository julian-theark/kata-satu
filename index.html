<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Kata Satu</title>
<meta name="description" content="One Indonesian word a day, with spaced-repetition reviews.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<link rel="icon" href="icon/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kata Satu">
<!-- "black", not "black-translucent": translucent lets the page run UNDER the
     status bar, where the clock and battery sit on top of the top bar. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#09090A">
<style>
/* ==========================================================================
   Kata Satu — built on the NXT design system (see NXT/web/css/app.css):
   near-black canvas, surfaces a clear step lighter so tiles read without
   borders, one lime accent that only ever carries meaning, generous radii,
   tabular numerals, real spring easings. Single-theme by design, like NXT.
   Layout: a sticky top bar, one card-stack screen, a fixed bottom action bar.
   ========================================================================== */
:root{
  --bg:#09090A;
  --surface:#19191C; --surface-2:#212125; --surface-3:#2B2B30;
  --line:rgba(255,255,255,.06); --line-strong:rgba(255,255,255,.14);
  --text:#FAFAFA; --text-2:#9B9BA3; --text-3:#6B6B74; --text-4:#4A4A52;

  --accent:#C8F94E; --accent-ink:#0C1004;
  --accent-soft:rgba(200,249,78,.13); --accent-line:rgba(200,249,78,.28);
  --neg:#FF6B5A; --neg-soft:rgba(255,107,90,.13);
  --warn:#FFB648; --warn-soft:rgba(255,182,72,.13);

  --r-sm:16px; --r:22px; --r-lg:28px; --r-pill:999px; --gutter:20px;
  --font:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;

  --ease:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.32,.64,1);
  color-scheme:dark;
}
/* Real springs where the browser can take them — the step response of a damped
   spring, so things settle with weight instead of wobbling. */
@supports (animation-timing-function: linear(0,1)){
  :root{
    --ease-spring:linear(0, .0581, .1924, .3569, .5215, .6687, .79, .8832, .9501, .9945, 1.021, 1.0343, 1.0384, 1.0367, 1.0318, 1.0255, 1.0191, 1.0134, 1.0086, 1.0049, 1.0022, 1.0004, .9993, .9987, 1);
  }
}

*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; background:var(--bg)}
body{
  font-family:var(--font); color:var(--text); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; -webkit-appearance:none; appearance:none}
.num{font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1}
::selection{background:var(--accent-soft)}

#app{
  min-height:100%; display:flex; flex-direction:column;
  max-width:560px; margin:0 auto; width:100%;
  padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));
}
/* Installed on the Home Screen, the page owns the whole screen, status-bar strip
   included — so it has to reserve that strip itself. In Safari the browser's own
   chrome already does it, hence the class rather than a blanket padding. */
html.standalone #app{padding-top:env(safe-area-inset-top, 0px)}
html.standalone .topbar{top:env(safe-area-inset-top, 0px)}
.pad{
  padding-left:max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right:max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* top bar */
.topbar{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:30;
  display:flex; align-items:center; gap:10px;
  padding-block:10px;
  background:rgba(9,9,10,.78);
  backdrop-filter:saturate(170%) blur(20px); -webkit-backdrop-filter:saturate(170%) blur(20px);
}
.pips{display:flex; gap:6px; align-items:center; flex:1 1 auto; min-width:0}
.pip{width:7px; height:7px; border-radius:var(--r-pill); background:var(--surface-3); transition:transform 400ms var(--ease-spring), background 200ms var(--ease)}
.pip.done{background:var(--accent)}
.pip.now{background:var(--accent); transform:scale(1.6)}
.day{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3)}
.iconbtn{
  width:42px; height:42px; flex:0 0 42px; display:grid; place-items:center;
  border-radius:var(--r-pill); color:var(--text-2); background:var(--surface);
  transition:background 140ms var(--ease), color 140ms var(--ease), transform 140ms var(--ease);
}
.iconbtn:active{background:var(--surface-3); color:var(--text); transform:scale(.93)}
.iconbtn svg{width:19px; height:19px}

main{flex:1 1 auto; padding-block:26px 20px; min-width:0}
.screen{animation:fade 220ms var(--ease)}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* type */
.label{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.label-quiet{color:var(--text-3)}
.hero{font-size:46px; font-weight:780; letter-spacing:-.042em; line-height:1; text-wrap:balance}
.title{font-size:20px; font-weight:700; letter-spacing:-.022em}
.ask{font-size:27px; font-weight:760; letter-spacing:-.03em; line-height:1.15; text-wrap:balance}
.ask em{font-style:normal; color:var(--accent)}
/* Accent inside running text: the taught word in its own sentence, the number
   that measures progress. Never used for emphasis that carries no meaning. */
.hl{color:var(--accent); font-weight:inherit}
.verdict .hl{font-weight:700}
.subtitle{font-size:15px; color:var(--text-2)}
.meta{font-size:13px; color:var(--text-3)}

.stack>*+*{margin-top:12px}
.stack-l>*+*{margin-top:20px}

/* cards */
.card{background:var(--surface); border-radius:var(--r); padding:18px}
.card-lg{border-radius:var(--r-lg); padding:22px}
.divider{height:1px; background:var(--line)}

.gloss{font-size:17px; color:var(--text-2); margin-top:8px}
.ex{font-size:16px; font-weight:600; letter-spacing:-.01em}
.exEn{font-size:14px; color:var(--text-3); margin-top:3px}
.note{font-size:13.5px; color:var(--text-2); line-height:1.5}

/* answers */
.opts{display:flex; flex-direction:column; gap:10px; margin-top:22px}
.opt{
  width:100%; text-align:left; display:flex; align-items:center; gap:10px;
  background:var(--surface); border-radius:var(--r); padding:17px 18px;
  font-size:16px; font-weight:600; letter-spacing:-.01em; color:var(--text);
  transition:transform 160ms var(--ease), background 160ms var(--ease), box-shadow 160ms var(--ease);
}
.opt:active{transform:scale(.975); background:var(--surface-2)}
.opt .mark{width:18px; flex:0 0 18px; font-size:13px; opacity:0; transition:opacity 150ms var(--ease)}
.opt.right{background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent-line); color:var(--accent)}
.opt.right .mark{opacity:1}
.opt.wrong{background:var(--neg-soft); box-shadow:inset 0 0 0 1px rgba(255,107,90,.3); color:var(--neg)}
.opt.wrong .mark{opacity:1}
.opt.dim{opacity:.4}
@keyframes nudge{20%{transform:translateX(-6px)} 45%{transform:translateX(6px)} 70%{transform:translateX(-3px)} 100%{transform:none}}
.opt.shake{animation:nudge .36s var(--ease)}

.verdict{margin-top:20px; font-size:15px; font-weight:650; letter-spacing:-.01em}
.verdict.ok{color:var(--accent)}
.verdict.no{color:var(--neg)}

/* stats */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px}
.tile{background:var(--surface); border-radius:var(--r); padding:18px; min-height:104px; display:flex; flex-direction:column; justify-content:space-between}
.tile-num{font-size:34px; font-weight:760; letter-spacing:-.04em; line-height:1}
.tile-num small{font-size:14px; font-weight:600; color:var(--text-3); letter-spacing:-.01em}
.tile-label{font-size:13px; font-weight:600; color:var(--text-2); letter-spacing:-.01em}
.streak{display:flex; align-items:baseline; gap:12px; margin-top:10px}
.streak b{font-size:56px; font-weight:780; letter-spacing:-.045em; line-height:1}
.streak span{color:var(--text-3); font-size:15px}

/* bottom action bar */
.bottombar{
  position:sticky; bottom:0; z-index:40;
  display:flex; flex-direction:column; gap:10px;
  padding-block:14px calc(6px + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(to top, rgba(9,9,10,.98) 55%, rgba(9,9,10,0));
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:56px; padding:0 24px; border-radius:var(--r-pill);
  font-size:16px; font-weight:650; letter-spacing:-.005em;
  background:var(--surface); color:var(--text);
  transition:transform 260ms var(--ease-spring), background 150ms var(--ease), opacity 150ms var(--ease);
}
.btn:active{transform:scale(.965); transition-duration:90ms}
.btn-primary{background:var(--accent); color:var(--accent-ink); font-weight:700; letter-spacing:-.01em}
.btn-primary:active{filter:brightness(.9)}
.btn-ghost{background:var(--surface); color:var(--text-2)}
.btn-danger{background:var(--neg-soft); color:var(--neg)}
.btn-sm{min-height:46px; font-size:14.5px}
/* The action bar is the one place a button owns the full width. */
.bottombar .btn{display:flex; width:100%}

/* the word list */
.wlist{display:flex; flex-direction:column; margin-top:8px}
.wrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 0}
.wrow+.wrow{border-top:1px solid var(--line)}
.wword{font-size:16px; font-weight:650; letter-spacing:-.01em; min-width:0}
.wword small{display:block; font-size:13px; font-weight:400; color:var(--text-3); letter-spacing:0}
.wmeta{flex:0 0 auto}
.pill{
  display:inline-flex; align-items:center; height:26px; padding:0 11px;
  border-radius:var(--r-pill); font-size:12px; font-weight:650; letter-spacing:-.005em;
  background:var(--surface-2); color:var(--text-3); white-space:nowrap;
}
.pill-accent{background:var(--accent-soft); color:var(--accent)}
.pill-neg{background:var(--neg-soft); color:var(--neg)}
.day{cursor:pointer}

/* settings */
.set{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0; flex-wrap:wrap}
.set+.set{border-top:1px solid var(--line)}
.set label{font-size:15px; font-weight:600; letter-spacing:-.01em}
.seg{display:flex; flex-wrap:wrap; padding:4px; background:var(--surface); border-radius:var(--r-pill); gap:2px; max-width:100%}
.seg button{
  min-height:38px; padding:0 13px; border-radius:var(--r-pill);
  font-size:14px; font-weight:650; letter-spacing:-.01em;
  color:var(--text-3); transition:color 200ms var(--ease), background 200ms var(--ease);
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.pair{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.input{
  width:100%; min-height:48px; padding:0 16px; border-radius:var(--r-pill);
  background:var(--surface); color:var(--text); border:1px solid transparent;
  font:inherit; font-size:15px; -webkit-appearance:none; appearance:none;
}
.input::placeholder{color:var(--text-4)}
.input:focus{outline:none; border-color:var(--accent-line); background:var(--surface-2)}
.swatches{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.sw{width:30px; height:30px; border-radius:var(--r-pill); box-shadow:inset 0 0 0 2px transparent; transition:transform 200ms var(--ease-spring)}
.sw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--bg), 0 0 0 2px var(--text); transform:scale(1.06)}

/* first run */
.pick{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:inline-flex; flex-direction:column; align-items:flex-start;
  padding:9px 14px; border-radius:var(--r-pill);
  background:var(--surface); color:var(--text);
  font-size:15px; font-weight:600; letter-spacing:-.01em;
  transition:transform 160ms var(--ease), background 160ms var(--ease);
}
.chip:active{transform:scale(.955)}
.chip small{font-size:11px; font-weight:500; color:var(--text-3); letter-spacing:0}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink); opacity:.65}
.scroll{max-height:48vh; overflow-y:auto; margin-top:14px; -webkit-overflow-scrolling:touch}

@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>

  <main class="pad" id="stage"></main>
  <div class="bottombar pad" id="actions"></div>
</div>

// ── scheduler ────────────────────────────────────────────────────────────────
// Pure functions. No Scriptable APIs, no I/O — so this file is unit-testable
// under plain node (see tools/simulate.js).

const LADDER = [1, 3, 7, 14, 30, 60];          // days, indexed by card.step
const EASE_MIN = 0.80, EASE_MAX = 1.30;
const LEECH_LAPSES = 4;                         // lapses before a card is a leech
const LEECH_STEP_CAP = 2;                       // leeches never exceed 7 days
const HISTORY_KEEP = 8;                         // deepest read is slice(-5)

// stage -> { fmt, dir, promote }
const STAGES = {
  1: { fmt: "intro",  dir: null,    promote: 0 },
  2: { fmt: "mc",     dir: "id_en", promote: 2 },
  3: { fmt: "mc",     dir: "en_id", promote: 2 },
  4: { fmt: "recall", dir: "id_en", promote: 2 },
  5: { fmt: "recall", dir: "en_id", promote: 3 },
  6: { fmt: "recall", dir: "en_id", promote: null }
};

function newCard(dayKey) {
  return {
    stage: 1, step: 0, ease: 1.0,
    intro: dayKey, last: null, next: dayKey,
    correct: 0, wrong: 0, lapses: 0, streak: 0,
    leech: false, history: []
  };
}

// A word you already know. Parked at the production stage on a long interval
// and excluded from review selection — you said you know it, so spending your
// daily budget re-testing it would be the opposite of the point.
function knownCard(dayKey) {
  const c = newCard(dayKey);
  c.stage = 6;
  c.step  = LADDER.length - 1;
  c.known = true;
  c.last  = dayKey;
  c.next  = addDays(dayKey, 180);
  return c;
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function intervalFor(card) {
  let step = card.step;
  if (card.leech) step = Math.min(step, LEECH_STEP_CAP);
  return Math.max(1, Math.round(LADDER[clamp(step, 0, LADDER.length - 1)] * card.ease));
}

// Apply one graded answer. Mutates and returns the card.
function grade(card, ok, dayKey, dir, fmt) {
  if (ok) {
    card.correct++;
    card.streak++;
    card.ease = clamp(+(card.ease + 0.05).toFixed(2), EASE_MIN, EASE_MAX);
    card.step = Math.min(LADDER.length - 1, card.step + 1);

    const rule = STAGES[card.stage];
    if (rule && rule.promote !== null && card.streak >= rule.promote && card.stage < 6) {
      card.stage++;
      card.streak = 0;
      card.step = Math.max(0, card.step - 1);   // re-test the harder format sooner
    }
    if (card.leech && card.streak >= 2) card.leech = false;
  } else {
    card.wrong++;
    card.lapses++;
    card.streak = 0;
    card.ease = clamp(+(card.ease - 0.15).toFixed(2), EASE_MIN, EASE_MAX);
    card.step = 0;                               // back to tomorrow

    // Demote on a pattern, not on one slip. Knocking a word back a full stage
    // every time you blank on it once makes stage 6 practically unreachable,
    // and punishes a bad night rather than a genuine gap in knowledge.
    const recentFails = card.history.slice(-2).filter(h => h[3] === false).length + 1;
    if (card.stage > 2 && recentFails >= 2) card.stage--;

    if (card.lapses >= LEECH_LAPSES) card.leech = true;
  }

  card.last = dayKey;
  card.next = addDays(dayKey, intervalFor(card));
  // Only the last 2-5 entries are ever read (demotion, recent form), but history
  // was 57% of the state file — which the widget parses on every refresh.
  card.history.push([dayKey, dir || "", fmt || "", !!ok]);
  if (card.history.length > HISTORY_KEEP) card.history = card.history.slice(-HISTORY_KEEP);
  return card;
}

function accuracy(card) {
  const n = card.correct + card.wrong;
  return n === 0 ? 0 : card.correct / n;
}

// Mastered = at the production stage (EN->ID recall) on a 30-day-plus interval.
// Reaching that already required ~9 successful promotions, so the interval is
// the evidence. Deliberately NOT gated on lifetime accuracy — a word you fumbled
// in week one but now recall reliably is mastered, and the stat should say so.
function isMastered(card) {
  return !card.known && card.stage === 6 && card.step >= 4;
}

// Recent form, for the leech check — the last few answers, not all history.
function recentAccuracy(card, n) {
  const h = card.history.slice(-(n || 5));
  if (!h.length) return 1;
  return h.filter(x => x[3] === true).length / h.length;
}

function isLearning(card) {
  return !card.known && card.stage >= 2 && card.stage <= 5;
}

// Which format/direction to test this card with, honouring the settings override.
function promptFor(card, direction) {
  const rule = STAGES[card.stage] || STAGES[2];
  let dir = rule.dir, fmt = rule.fmt;
  if (direction === "id_en" || direction === "en_id") dir = direction;
  else if (direction === "both") dir = (card.correct + card.wrong) % 2 ? "en_id" : "id_en";
  return { fmt, dir };
}

// ── selection ────────────────────────────────────────────────────────────────
// Total order: score desc, then vocab index asc. Determinism here is what lets
// the widget and the app compute the same plan with no coordination.
function selectDue(cards, dayKey, limit, order) {
  const due = [];
  for (const id of order) {
    const c = cards[id];
    if (!c || c.stage < 2 || c.known) continue;
    if (daysBetween(c.next, dayKey) < 0) continue;      // not due yet
    due.push({ id, score: scoreCard(c, dayKey), idx: order.indexOf(id) });
  }
  due.sort((a, b) => (b.score - a.score) || (a.idx - b.idx));
  return due.slice(0, limit).map(d => d.id);
}

function scoreCard(card, dayKey) {
  const overdue = Math.max(0, daysBetween(card.next, dayKey));
  return overdue + (card.leech ? 10 : 0) + card.lapses * 1.5;
}

// ── distractors ──────────────────────────────────────────────────────────────
// Believable alternatives, drawn from words already encountered where possible.
// Antonyms are welcome — "cheap" is the best possible distractor for "mahal".
function distractors(vocab, target, introducedIds, rng, avoid) {
  const pool = vocab.filter(v => v.id !== target.id);
  const seen = new Set(introducedIds);
  const skip = new Set(avoid || []);

  const tiers = [
    pool.filter(v => seen.has(v.id) && v.cat === target.cat),
    pool.filter(v => seen.has(v.id) && v.diff === target.diff),
    pool.filter(v => seen.has(v.id)),
    pool.filter(v => v.cat === target.cat),   // early days: not enough seen words
    pool
  ];

  const out = [], used = new Set([target.id]);
  for (const tier of tiers) {
    for (const v of shuffle(tier, rng)) {
      if (out.length === 3) break;
      if (used.has(v.id)) continue;
      if (skip.has(v.id) && out.length < 3) continue;   // avoid last session's set
      if (v.en === target.en) continue;                 // never two identical glosses
      used.add(v.id); out.push(v);
    }
    if (out.length === 3) break;
  }
  // last resort: allow the avoided ones rather than render fewer than 4 options
  if (out.length < 3) {
    for (const v of shuffle(pool, rng)) {
      if (out.length === 3) break;
      if (used.has(v.id) || v.en === target.en) continue;
      used.add(v.id); out.push(v);
    }
  }
  return out;
}

// ── seeded PRNG ──────────────────────────────────────────────────────────────
// Deterministic shuffles: the widget renders option order X, and the session
// script must rebuild exactly X to know what "option 2" meant.
function hash32(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ── date helpers (dayKey = "YYYY-MM-DD", always local) ───────────────────────
function parseKey(k) {
  const p = String(k).split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2], 12, 0, 0);   // noon avoids DST edges
}

function fmtKey(d) {
  const p = n => (n < 10 ? "0" : "") + n;
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

function addDays(k, n) {
  const d = parseKey(k);
  d.setDate(d.getDate() + n);
  return fmtKey(d);
}

// positive when `to` is after `from`
function daysBetween(from, to) {
  return Math.round((parseKey(to) - parseKey(from)) / 86400000);
}

// ── day ──────────────────────────────────────────────────────────────────────
// Day planning is a PURE function of (state, vocab, dayKey). The widget calls it
// to render and writes nothing; the session script persists it when you open it.
// Both therefore always agree on "today" with zero coordination and no races.
// Pure — no Scriptable APIs. Depends on scheduler.js.

const DAY_BOUNDARY_HOUR = 4;   // a review at 01:00 counts for the previous day

function dayKeyOf(date) {
  const d = new Date(date.getTime());
  if (d.getHours() < DAY_BOUNDARY_HOUR) d.setDate(d.getDate() - 1);
  return fmtKey(d);
}

function vocabOrder(vocab) { return vocab.map(v => v.id); }

function byId(vocab) {
  const m = {};
  for (const v of vocab) m[v.id] = v;
  return m;
}

// Every card actually due, not just the ones that fit today's budget.
function countAllDue(cards, dayKey, order) {
  let n = 0;
  for (const id of order) {
    const c = cards[id];
    if (!c || c.stage < 2) continue;
    if (daysBetween(c.next, dayKey) >= 0) n++;
  }
  return n;
}

function planNonce(dayKey, reviewIds, newIds) {
  return hash32(dayKey + "|" + reviewIds.join(",") + "|" + newIds.join(",")).toString(36);
}

// The persisted plan always wins, so the day can't reshuffle under you.
function planDay(state, vocab, dayKey) {
  if (state.days[dayKey]) {
    const p = state.days[dayKey];
    // Self-heal: a word marked "I already know this" after today's plan was
    // written must not keep showing up as today's word — least of all on the
    // widget, which renders straight from the stored plan.
    const kept = p.newIds.filter(id => !(state.cards[id] && state.cards[id].known));
    let newIds = kept;
    if (kept.length < p.newIds.length) {
      const want = p.newIds.length - kept.length;
      newIds = kept.concat(nextUnintroduced(state, vocab, want, kept));
    }
    return Object.assign({ dayKey: dayKey }, p, {
      newIds: newIds,
      nonce: planNonce(dayKey, p.reviewIds, newIds)
    });
  }

  const order = vocabOrder(vocab);
  const s = state.settings;

  // ── the introduction gate ──────────────────────────────────────────────────
  // RETENTION > NUMBER OF WORDS. Adding a word every single day outruns any
  // realistic review budget: each word needs roughly nine reviews to reach
  // stage 6, so a fixed 2/day drip leaves words half-learned forever and the
  // due queue grows without bound. So: only introduce a new word on a day when
  // you are actually keeping up. The system self-balances — words that reach
  // long intervals free capacity, which reopens the gate.
  // Threshold tuned by simulation (tools/simulate.js). At 1.0x the gate starves
  // novelty; at 2x+ mastery collapses. 1.5x is the knee of the curve.
  const backlog = countAllDue(state.cards, dayKey, order);
  const gateOpen = backlog <= Math.round(s.reviewsPerDay * 1.5);

  const newIds = [];
  if (gateOpen) {
    for (const id of order) {
      if (newIds.length >= s.newWordsPerDay) break;
      if (!state.cards[id]) newIds.push(id);
    }
  }

  const reviewIds = selectDue(state.cards, dayKey, s.reviewsPerDay, order);

  return {
    dayKey: dayKey,
    newIds: newIds,
    reviewIds: reviewIds,
    newSeen: false,
    answered: {},
    complete: false,
    nonce: planNonce(dayKey, reviewIds, newIds)
  };
}

// The next words in curriculum order that have never been seen.
function nextUnintroduced(state, vocab, count, exclude) {
  const skip = exclude || [];
  const out = [];
  for (const v of vocab) {
    if (out.length >= count) break;
    if (state.cards[v.id] || skip.indexOf(v.id) >= 0) continue;
    out.push(v.id);
  }
  return out;
}

// "I already know this": park the word and pull the next one into today's slot,
// so a whole stretch of familiar vocabulary can be cleared in one sitting
// instead of one word per day for a month.
function skipAsKnown(state, plan, vocab, dayKey, id) {
  if (!state.cards[id]) state.cards[id] = knownCard(dayKey);
  plan.newIds = nextUnintroduced(state, vocab, state.settings.newWordsPerDay);
  plan.newSeen = false;
  persistPlan(state, plan);
  return plan.newIds[0] || null;
}

// Bulk version of "I know this", for the preselect screen.
function markKnownBulk(state, plan, vocab, dayKey, ids) {
  const wanted = {};
  for (const id of ids || []) wanted[id] = true;

  for (const v of vocab) {
    const has = state.cards[v.id];
    if (wanted[v.id]) {
      // never downgrade a word already being learned properly
      if (!has) state.cards[v.id] = knownCard(dayKey);
    } else if (has && has.known) {
      delete state.cards[v.id];              // unticked: hand it back to the queue
    }
  }
  plan.newIds  = nextUnintroduced(state, vocab, state.settings.newWordsPerDay);
  plan.newSeen = false;
  persistPlan(state, plan);
  return plan.newIds[0] || null;
}

// ── one more word ────────────────────────────────────────────────────────────
// Some days the word is one you already knew, or you simply have more appetite.
// EXTRA_MAX keeps that from turning into cramming: the gate exists to protect
// retention, so extras stay a deliberate, capped, per-day decision.
const EXTRA_MAX = 2;

function extrasUsed(state, plan) {
  return Math.max(0, plan.newIds.length - state.settings.newWordsPerDay);
}
function canAddExtra(state, vocab, plan) {
  if (extrasUsed(state, plan) >= EXTRA_MAX) return false;
  return nextUnintroduced(state, vocab, 1, plan.newIds).length > 0;
}

function addExtraWord(state, plan, vocab, dayKey) {
  if (!canAddExtra(state, vocab, plan)) return null;
  const id = nextUnintroduced(state, vocab, 1, plan.newIds)[0];
  plan.newIds = plan.newIds.concat([id]);
  plan.newSeen = false;                    // the new one still has to be seen
  persistPlan(state, plan);
  return id;
}

function persistPlan(state, plan) {
  state.days[plan.dayKey] = {
    newIds: plan.newIds,
    reviewIds: plan.reviewIds,
    newSeen: !!plan.newSeen,
    answered: plan.answered || {},
    complete: !!plan.complete
  };
  pruneDays(state);
  return state.days[plan.dayKey];
}

function pruneDays(state, keep) {
  const keys = Object.keys(state.days).sort();
  const max = keep || 90;
  while (keys.length > max) delete state.days[keys.shift()];
}

function planIsComplete(plan) {
  if (!plan.newSeen && plan.newIds.length) return false;
  for (const id of plan.reviewIds) if (!(id in (plan.answered || {}))) return false;
  return true;
}

function remainingReviews(plan) {
  return plan.reviewIds.filter(id => !(id in (plan.answered || {}))).length;
}

// ── session construction ─────────────────────────────────────────────────────
// Deterministic: seeded on dayKey+cardId, so the widget and the session script
// produce byte-identical option ordering. That is what makes a widget tap safe.
function buildQuestion(state, vocabMap, vocab, dayKey, cardId) {
  const card = state.cards[cardId];
  const v = vocabMap[cardId];
  if (!card || !v) return null;

  const p = promptFor(card, state.settings.direction);
  const q = {
    id: cardId, fmt: p.fmt, dir: p.dir,
    word: v.word, en: v.en, ex: v.ex, exEn: v.exEn, note: v.note || null,
    stage: card.stage
  };

  if (p.fmt === "mc") {
    const rng = mulberry(hash32(dayKey + "|" + cardId + "|" + p.dir));
    const introduced = Object.keys(state.cards);
    const ds = distractors(vocab, v, introduced, rng, card.lastD || []);
    const opts = shuffle([v].concat(ds), rng);
    q.options = opts.map(o => ({
      id: o.id,
      label: p.dir === "id_en" ? o.en : o.word
    }));
    q.answerIdx = opts.findIndex(o => o.id === v.id);
    q.distractorIds = ds.map(o => o.id);
  }
  return q;
}

function buildSession(state, vocab, dayKey, plan) {
  const vm = byId(vocab);
  const newWords = plan.newIds.filter(id => !state.cards[id]).map(id => {
    const v = vm[id];
    return v ? {
      id: v.id, word: v.word, en: v.en, ex: v.ex, exEn: v.exEn,
      note: v.note || null, cat: v.cat
    } : null;
  }).filter(Boolean);

  const questions = plan.reviewIds
    .filter(id => !(id in (plan.answered || {})))
    .map(id => buildQuestion(state, vm, vocab, dayKey, id))
    .filter(Boolean);

  // a look-ahead queue so "I know this" can advance without a round trip
  const upcoming = nextUnintroduced(state, vocab, 30, plan.newIds).map(id => {
    const v = vm[id];
    return { id: v.id, word: v.word, en: v.en, ex: v.ex, exEn: v.exEn, note: v.note || null, cat: v.cat };
  });
  return {
    newWords: newWords, questions: questions, newSeen: !!plan.newSeen,
    upcoming: upcoming,
    extraLeft: Math.max(0, EXTRA_MAX - extrasUsed(state, plan))
  };
}

// ── mutations ────────────────────────────────────────────────────────────────
function introduceNew(state, plan, dayKey) {
  for (const id of plan.newIds) {
    if (!state.cards[id]) {
      state.cards[id] = newCard(dayKey);
      state.cards[id].stage = 2;          // taught today, first tested tomorrow
      state.cards[id].next = addDays(dayKey, 1);
    }
  }
  plan.newSeen = true;
  persistPlan(state, plan);
}

function recordAnswer(state, plan, dayKey, cardId, ok, dir, fmt, distractorIds) {
  const card = state.cards[cardId];
  if (!card) return false;
  if (cardId in (plan.answered || {})) return false;   // never double-count

  grade(card, ok, dayKey, dir, fmt);
  if (distractorIds && distractorIds.length) card.lastD = distractorIds;

  plan.answered = plan.answered || {};
  plan.answered[cardId] = !!ok;
  state.totals.reviewsCompleted++;
  persistPlan(state, plan);
  return true;
}

// Streak advances only on completion, and only once per day.
function settleDay(state, plan, dayKey) {
  if (!planIsComplete(plan)) return false;
  plan.complete = true;
  persistPlan(state, plan);

  const st = state.streak;
  if (st.lastCompletedDay === dayKey) return true;    // already counted

  const gap = st.lastCompletedDay ? daysBetween(st.lastCompletedDay, dayKey) : null;
  st.current = (gap === 1) ? st.current + 1 : 1;
  st.lastCompletedDay = dayKey;
  if (st.current > st.longest) st.longest = st.current;
  return true;
}

// A streak is stale the moment a whole day is skipped.
function liveStreak(state, dayKey) {
  const st = state.streak;
  if (!st.lastCompletedDay) return 0;
  const gap = daysBetween(st.lastCompletedDay, dayKey);
  return (gap === 0 || gap === 1) ? st.current : 0;
}

// The streak once today is settled. The completion screen renders from stats
// captured before settling, so without this it congratulates you with
// yesterday's number.
function streakOnComplete(state, dayKey) {
  const st = state.streak;
  if (st.lastCompletedDay === dayKey) return st.current;
  const gap = st.lastCompletedDay ? daysBetween(st.lastCompletedDay, dayKey) : null;
  return (gap === 1) ? st.current + 1 : 1;
}

function stats(state, vocab, dayKey) {
  const ids = Object.keys(state.cards);
  let learning = 0, mastered = 0, known = 0;
  for (const id of ids) {
    const c = state.cards[id];
    if (c.known) { known++; continue; }
    if (isMastered(c)) mastered++;
    else if (isLearning(c)) learning++;
  }
  const plan = planDay(state, vocab, dayKey);
  return {
    streak: liveStreak(state, dayKey),
    streakOnComplete: streakOnComplete(state, dayKey),
    longest: state.streak.longest,
    introduced: ids.length - known,
    known: known,
    learning: learning,
    mastered: mastered,
    reviewsCompleted: state.totals.reviewsCompleted,
    dueToday: plan.reviewIds.length,
    backlog: countAllDue(state.cards, dayKey, vocabOrder(vocab)),
    remaining: remainingReviews(plan),
    gated: plan.newIds.length === 0 && ids.length < vocab.length,
    total: vocab.length,
    dayNumber: dayNumber(state, dayKey)
  };
}

// "DAY 24" — days since you started, not a count of completions.
function dayNumber(state, dayKey) {
  const days = Object.keys(state.days).sort();
  const first = state.firstDay || days[0];
  if (!first) return 1;
  return Math.max(1, daysBetween(first, dayKey) + 1);
}

// ── Kata Satu · web ──────────────────────────────────────────────────────────
// The same scheduler and day planner as before; only the surface is new. State
// lives in the artifact's own store when the viewer is signed in, with a local
// mirror so a flaky connection never costs a session.

// NXT uses a single accent that only ever carries meaning. These are the same
// idea in other hues, each with the ink colour that stays legible on it.
const ACCENTS = {
  lime:   { base: "#C8F94E", ink: "#0C1004" },
  cyan:   { base: "#5BE9E0", ink: "#021413" },
  amber:  { base: "#FFB648", ink: "#1B1000" },
  coral:  { base: "#FF8A6B", ink: "#1C0702" },
  violet: { base: "#B99BFF", ink: "#120626" },
  sky:    { base: "#7FB2FF", ink: "#040F22" }
};

function softOf(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

const LS_KEY = "kata-satu-state";
const DB_PATH = "progress/state";

// ── the Google Sheet (NXT's backend) ─────────────────────────────────────────
// The installed build has no Claude account behind it, so it keeps its state in
// the same spreadsheet the gym app uses, through that backend's generic blob
// store. The endpoint and token are typed once and live on the device only —
// publishing this app to a static host never exposes write access.
const SHEET_KEY = "kata-satu-sheet";
let SHEET = null;          // {endpoint, token, profile}

// Each person gets their own row in the store, so one spreadsheet can carry
// several learners without their progress ever meeting.
function sheetDoc() {
  const who = (SHEET && SHEET.profile ? SHEET.profile : "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return who ? "kata-satu:" + who : "kata-satu";
}
let sheetState = "off";    // off | ok | error | saving

function readSheetCreds() {
  try { return JSON.parse(localStorage.getItem(SHEET_KEY) || "null"); }
  catch (e) { return null; }
}
function writeSheetCreds(c) {
  try {
    if (c) localStorage.setItem(SHEET_KEY, JSON.stringify(c));
    else localStorage.removeItem(SHEET_KEY);
  } catch (e) {}
  SHEET = c;
}

// text/plain keeps this a CORS "simple request" — Apps Script cannot answer the
// preflight that application/json would trigger.
async function sheetCall(action, payload) {
  if (!SHEET) throw new Error("not paired");
  const res = await fetch(SHEET.endpoint, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ token: SHEET.token, action: action, payload: payload || {} })
  });
  const body = await res.json();
  // The backend's envelope: {success, data} or {success:false, error:{message}}.
  if (!body || body.success !== true)
    throw new Error((body && body.error && body.error.message) || "backend refused the call");
  return body.data;
}

async function sheetPull() {
  const out = await sheetCall("appStateGet", { key: sheetDoc() });
  if (!out || !out.value) return null;
  try { return JSON.parse(out.value); } catch (e) { return null; }
}

async function sheetPush(state) {
  return sheetCall("appStateSet", { key: sheetDoc(), value: JSON.stringify(state) });
}

function defaultState() {
  return {
    version: 1,
    firstDay: null,
    onboarded: false,
    settings: {
      accentPreset: "lime",
      newWordsPerDay: 1,
      reviewsPerDay: 3,
      direction: "adaptive"
    },
    streak: { current: 0, longest: 0, lastCompletedDay: null },
    totals: { reviewsCompleted: 0 },
    cards: {},
    days: {}
  };
}

// ── storage ──────────────────────────────────────────────────────────────────
let DB = null;             // the artifact store, once it answers
let STATE = defaultState();
let saveTimer = null;

function readLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function writeLocal(s) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {}
}

function merge(into) {
  const d = defaultState();
  const s = Object.assign(d, into || {});
  s.settings = Object.assign(d.settings, (into && into.settings) || {});
  s.streak = Object.assign(d.streak, (into && into.streak) || {});
  s.totals = Object.assign(d.totals, (into && into.totals) || {});
  s.cards = (into && into.cards) || {};
  s.days = (into && into.days) || {};
  return s;
}

// Every mutation goes through save(): local immediately, store coalesced.
function save() {
  writeLocal(STATE);
  if (!DB && !SHEET) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (DB) DB.doc(DB_PATH).set({ state: JSON.stringify(STATE) }).catch(() => {});
    if (SHEET) {
      sheetState = "saving";
      sheetPush(STATE)
        .then(() => { sheetState = "ok"; })
        .catch(() => { sheetState = "error"; });   // the local copy still holds it
    }
  }, 700);
}

async function boot() {
  STATE = merge(readLocal());
  applyAccent();
  start();                                  // paint from local at once

  SHEET = readSheetCreds();
  if (SHEET) {
    try {
      const remote = await sheetPull();
      sheetState = "ok";
      adopt(remote);
    } catch (e) { sheetState = "error"; }
    return;                                 // paired to the Sheet: that is the store
  }

  let db = null;
  try { db = typeof claude !== "undefined" ? await claude.use("db") : null; }
  catch (e) { db = null; }
  if (!db) return;                          // local only
  DB = db;
  try {
    const doc = await db.doc(DB_PATH).get();
    adopt(doc && doc.state ? JSON.parse(doc.state) : null);
  } catch (e) {}
}

// Take the remote copy when it is ahead of this device, otherwise seed the
// backend from here. Either way nothing already answered is thrown away.
function adopt(remote) {
  if (remote && newer(remote, STATE)) {
    STATE = merge(remote);
    applyAccent();
    start();
  } else {
    save();
  }
}

// More days recorded wins; it is the only ordering that cannot lose answers.
function newer(a, b) {
  const ca = Object.keys(a.cards || {}).length, cb = Object.keys(b.cards || {}).length;
  if (ca !== cb) return ca > cb;
  return (a.totals && a.totals.reviewsCompleted || 0) > (b.totals && b.totals.reviewsCompleted || 0);
}

// ── accent ───────────────────────────────────────────────────────────────────
function applyAccent() {
  const a = ACCENTS[STATE.settings.accentPreset] || ACCENTS.lime;
  const root = document.documentElement.style;
  root.setProperty("--accent", a.base);
  root.setProperty("--accent-ink", a.ink);
  root.setProperty("--accent-soft", softOf(a.base, .13));
  root.setProperty("--accent-line", softOf(a.base, .28));
}

// ── session ──────────────────────────────────────────────────────────────────
const stage = document.getElementById("stage");
const actions = document.getElementById("actions");
const pipsEl = document.getElementById("pips");
const dayEl = document.getElementById("day");

// `steps` is always the work REMAINING, rebuilt from the plan after every
// action. An index into it would be wrong the moment the list changes shape —
// which it does as soon as a word is introduced or an answer is recorded.
let plan = null, steps = [], dayKey = null, skipped = 0;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Accent on the word being taught, inside its own example sentence. Indonesian
// builds on roots, so "makan" also lights up inside "makanan" — which is the
// point: it shows you the word you are learning doing its job.
function hl(sentence, word) {
  const safe = esc(sentence);
  const stem = esc(String(word).split(/\s+/)[0]);
  if (!stem) return safe;
  const re = new RegExp("(" + stem.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
  return safe.replace(re, '<b class="hl">$1</b>');
}

function start() {
  dayKey = dayKeyOf(new Date());
  if (!STATE.firstDay) STATE.firstDay = dayKey;
  plan = planDay(STATE, VOCAB, dayKey);
  persistPlan(STATE, plan);
  save();
  if (!STATE.onboarded && !Object.keys(STATE.cards).length) return onboarding();
  rebuild();
  render();
}

function rebuild() {
  const s = buildSession(STATE, VOCAB, dayKey, plan);
  steps = [];
  if (s.newWords.length && !s.newSeen) for (const w of s.newWords) steps.push({ k: "new", w: w });
  for (const q of s.questions) steps.push({ k: "q", q: q });
}

function pips() {
  const total = plan.newIds.length + plan.reviewIds.length;
  if (!total) { pipsEl.innerHTML = ""; return; }
  const left = steps.length;
  let h = "";
  for (let i = 0; i < total; i++) {
    const state = i < total - left ? "done" : (i === total - left ? "now" : "");
    h += '<i class="pip ' + state + '"></i>';
  }
  pipsEl.innerHTML = h;
}

function render() {
  const st = stats(STATE, VOCAB, dayKey);
  dayEl.textContent = "Day " + st.dayNumber;
  pips();
  if (!steps.length) return done();
  const s = steps[0];
  return s.k === "new" ? newWord(s.w) : question(s.q);
}

function act(html) { actions.innerHTML = html; }

// ── the new word ─────────────────────────────────────────────────────────────
function newWord(w) {
  stage.innerHTML =
    '<div class="screen stack-l">' +
      '<div>' +
        '<div class="label">New today</div>' +
        '<div class="hero" style="margin-top:12px">' + esc(w.word) + '</div>' +
        '<div class="gloss">' + esc(w.en) + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="ex">' + hl(w.ex, w.word) + '</div>' +
        '<div class="exEn">' + esc(w.exEn) + '</div>' +
      '</div>' +
      (w.note ? '<div class="card"><div class="note">' + esc(w.note) + '</div></div>' : '') +
      (skipped ? '<div class="meta">' + skipped + ' word' + (skipped > 1 ? 's' : '') +
                 ' parked as known</div>' : '') +
    '</div>';

  act('<button class="btn btn-primary" id="got">Got it</button>' +
      '<button class="btn btn-ghost btn-sm" id="know">I know this already</button>');

  document.getElementById("got").onclick = () => {
    introduceNew(STATE, plan, dayKey);
    save(); rebuild(); render();
  };
  document.getElementById("know").onclick = () => {
    skipAsKnown(STATE, plan, VOCAB, dayKey, w.id);
    save(); skipped++;
    rebuild(); render();
  };
}

// ── a review ─────────────────────────────────────────────────────────────────
function question(q) {
  const ask = q.dir === "id_en"
    ? 'What does <em>' + esc(q.word) + '</em> mean?'
    : 'How do you say <em>' + esc(q.en) + '</em>?';

  if (q.fmt === "mc") {
    stage.innerHTML =
      '<div class="screen">' +
        '<div class="label">Review</div>' +
        '<div class="ask" style="margin-top:12px">' + ask + '</div>' +
        '<div class="opts" id="opts">' +
        q.options.map((o, k) =>
          '<button class="opt" data-k="' + k + '"><span class="mark">\u25CF</span>' +
          '<span>' + esc(o.label) + '</span></button>').join("") +
        '</div>' +
      '</div>';
    act("");
    const opts = [...document.querySelectorAll(".opt")];
    let answered = false;             // a second tap must never grade twice
    opts.forEach(b => b.onclick = () => {
      if (answered) return;
      answered = true;
      const k = +b.dataset.k;
      const ok = k === q.answerIdx;
      opts.forEach(o => { o.onclick = null; o.classList.add("dim"); });
      b.classList.remove("dim");
      b.classList.add(ok ? "right" : "shake");
      if (!ok) {
        b.classList.add("wrong");
        const right = opts[q.answerIdx];
        right.classList.remove("dim");
        right.classList.add("right");
      }
      judge(q, ok);
    });
    return;
  }

  // free recall: look, then grade yourself — the format that actually tests
  stage.innerHTML =
    '<div class="screen">' +
      '<div class="label">Recall</div>' +
      '<div class="ask" style="margin-top:12px">' + ask + '</div>' +
    '</div>';
  act('<button class="btn btn-primary" id="show">Show the answer</button>');
  document.getElementById("show").onclick = () => {
    stage.innerHTML =
      '<div class="screen stack-l">' +
        '<div>' +
          '<div class="label">Recall</div>' +
          '<div class="hero" style="margin-top:12px">' +
            esc(q.dir === "id_en" ? q.en : q.word) + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="ex">' + hl(q.ex, q.word) + '</div>' +
          '<div class="exEn">' + esc(q.exEn) + '</div>' +
        '</div>' +
      '</div>';
    act('<button class="btn btn-primary" id="yes">I knew it</button>' +
        '<button class="btn btn-ghost btn-sm" id="no">Missed it</button>');
    document.getElementById("yes").onclick = () => judge(q, true);
    document.getElementById("no").onclick = () => judge(q, false);
  };
}

function judge(q, ok) {
  recordAnswer(STATE, plan, dayKey, q.id, ok, q.dir, q.fmt, q.distractorIds);
  save();
  const extra = (!ok && q.note) ? '<div class="note">' + esc(q.note) + '</div>' : '';
  const body =
    '<div class="verdict ' + (ok ? "ok" : "no") + '">' +
      (ok ? "Correct" : "Not quite — " + esc(q.word) + " is " + esc(q.en)) + '</div>' + extra;
  stage.insertAdjacentHTML("beforeend", body);
  act('<button class="btn btn-primary" id="next">Continue</button>');
  const next = document.getElementById("next");
  next.onclick = () => { rebuild(); render(); };
  setTimeout(() => { try { next.focus({ preventScroll: true }); } catch (e) {} }, 60);
}

// ── finished ─────────────────────────────────────────────────────────────────
function done() {
  settleDay(STATE, plan, dayKey);
  save();
  const st = stats(STATE, VOCAB, dayKey);
  const pct = st.total ? Math.round((st.introduced / st.total) * 100) : 0;

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="label">Today complete</div>' +
      '<div class="streak"><b class="num hl">' + (st.streakOnComplete || st.streak) +
        '</b><span>day streak</span></div>' +
      '<div class="tiles">' +
        tile(st.learning, "", "Learning") +
        tile(st.mastered, "", "Mastered") +
        tile(st.introduced, " of " + st.total, "Words seen") +
        tile(st.reviewsCompleted, "", "Reviews done") +
      '</div>' +
      (st.known ? '<div class="meta" style="margin-top:14px">' + st.known +
                  ' parked as already known \u00b7 ' + pct + '% of the course touched</div>' : '') +
    '</div>';

  const more = canAddExtra(STATE, VOCAB, plan);
  act((more ? '<button class="btn btn-primary" id="more">Teach me one more word</button>' : "") +
      '<button class="btn btn-ghost btn-sm" id="words">See the words I\u2019m learning</button>' +
      '<button class="btn btn-ghost btn-sm" id="close">Done for today</button>');
  document.getElementById("words").onclick = wordsScreen;

  if (more) document.getElementById("more").onclick = () => {
    addExtraWord(STATE, plan, VOCAB, dayKey);
    save();
    rebuild(); render();
  };
  document.getElementById("close").onclick = () => {
    stage.innerHTML =
      '<div class="screen">' +
        '<div class="label">See you tomorrow</div>' +
        '<div class="ask" style="margin-top:12px"><em>One word</em>, ' +
          STATE.settings.reviewsPerDay + ' reviews, about thirty seconds.</div>' +
        '<div class="subtitle" style="margin-top:14px">Keeping the streak is the whole trick.</div>' +
      '</div>';
    act('<button class="btn btn-ghost" id="again">Back</button>');
    document.getElementById("again").onclick = () => { rebuild(); render(); };
  };
}

function tile(n, suffix, label) {
  return '<div class="tile"><div class="tile-num num">' + n +
         (suffix ? '<small>' + suffix + '</small>' : '') + '</div>' +
         '<div class="tile-label">' + label + '</div></div>';
}

// ── first run ────────────────────────────────────────────────────────────────
// One pass, once: tick what you can already use so the course starts where you
// actually are instead of teaching "permisi" on day forty.
function onboarding() {
  const list = VOCAB.slice(0, 150);
  const picked = {};
  pipsEl.innerHTML = "";

  const draw = () => {
    const n = Object.keys(picked).length;
    stage.innerHTML =
      '<div class="screen">' +
      '<div class="label">Before you start</div>' +
      '<div class="ask" style="margin-top:12px">What do you <em>already know</em>?</div>' +
      '<div class="subtitle" style="margin-top:12px">Tap every word you can already use. ' +
      'Those get parked \u2014 never taught, never tested.</div>' +
      '<div class="scroll"><div class="pick">' +
      list.map(v => '<button class="chip" data-id="' + v.id + '" aria-pressed="' +
        (picked[v.id] ? "true" : "false") + '">' + esc(v.word) +
        '<small>' + esc(v.en) + '</small></button>').join("") +
      '</div></div></div>';
    act('<button class="btn btn-primary" id="go">' +
        (n ? "Start — " + n + " parked" : "Start learning") + '</button>');

    stage.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      const id = c.dataset.id;
      if (picked[id]) delete picked[id]; else picked[id] = true;
      c.setAttribute("aria-pressed", picked[id] ? "true" : "false");
      const k = Object.keys(picked).length;
      document.getElementById("go").textContent =
        k ? "Start — " + k + " parked" : "Start learning";
    });
    document.getElementById("go").onclick = () => {
      markKnownBulk(STATE, plan, VOCAB, dayKey, Object.keys(picked));
      STATE.onboarded = true;
      save();
      rebuild(); render();
    };
  };
  draw();
}

// ── what you are learning ────────────────────────────────────────────────────
// A word you cannot see is a word you cannot rehearse on the way to the shop.
// This is the whole day plus everything currently in flight, newest first.
function wordsScreen() {
  const vm = byId(VOCAB);
  const day = STATE.days[dayKey] || { newIds: [], reviewIds: [], answered: {} };
  const answered = day.answered || {};

  const todayRows = []
    .concat((day.newIds || []).map(id => ({ id: id, tag: "new" })))
    .concat((day.reviewIds || []).map(id => ({
      id: id, tag: id in answered ? (answered[id] ? "right" : "wrong") : "due"
    })));

  // In flight: introduced, not parked, not finished. Soonest due first, so the
  // list reads as "what is coming back at me".
  const learning = Object.keys(STATE.cards)
    .filter(id => { const c = STATE.cards[id]; return c && !c.known && !isMastered(c); })
    .sort((a, b) => (STATE.cards[a].next || "").localeCompare(STATE.cards[b].next || ""));

  const line = (id, right) => {
    const v = vm[id];
    if (!v) return "";
    return '<div class="wrow"><div class="wword">' + esc(v.word) +
           '<small>' + esc(v.en) + '</small></div>' +
           '<div class="wmeta">' + right + '</div></div>';
  };

  const badge = tag =>
    tag === "new"   ? '<span class="pill pill-accent">new today</span>' :
    tag === "right" ? '<span class="pill pill-accent">\u2713</span>' :
    tag === "wrong" ? '<span class="pill pill-neg">missed</span>' :
                      '<span class="pill">due</span>';

  const when = id => {
    const c = STATE.cards[id];
    if (!c) return "";
    const d = daysBetween(dayKey, c.next);
    const label = d <= 0 ? "due now" : d === 1 ? "tomorrow" : "in " + d + " days";
    return '<span class="pill">' + label + '</span>';
  };

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="title">Your words</div>' +

      '<div class="label label-quiet" style="margin-top:22px">Today</div>' +
      (todayRows.length
        ? '<div class="wlist">' + todayRows.map(r => line(r.id, badge(r.tag))).join("") + '</div>'
        : '<div class="meta" style="margin-top:8px">Nothing scheduled today.</div>') +

      '<div class="label label-quiet" style="margin-top:26px">Still learning \u00b7 ' +
        learning.length + '</div>' +
      (learning.length
        ? '<div class="wlist">' + learning.map(id => line(id, when(id))).join("") + '</div>'
        : '<div class="meta" style="margin-top:8px">Nothing in flight yet.</div>') +
    '</div>';

  act('<button class="btn btn-primary" id="back">Done</button>');
  document.getElementById("back").onclick = () => { rebuild(); render(); };
}

// ── settings ─────────────────────────────────────────────────────────────────
document.getElementById("gear").onclick = settings;
dayEl.onclick = wordsScreen;

function settings() {
  const s = STATE.settings;
  const st = stats(STATE, VOCAB, dayKey);
  pipsEl.innerHTML = "";

  stage.innerHTML =
    '<div class="screen">' +
      '<div class="title">Settings</div>' +

      '<div class="label label-quiet" style="margin-top:22px">Accent</div>' +
      '<div class="set"><label>Colour</label><div class="swatches" id="sw">' +
        Object.keys(ACCENTS).map(k =>
          '<button class="sw" data-k="' + k + '" aria-pressed="' +
          (s.accentPreset === k ? "true" : "false") + '" aria-label="' + k +
          '" style="background:' + ACCENTS[k].base + '"></button>').join("") +
      '</div></div>' +

      '<div class="label label-quiet" style="margin-top:22px">Daily load</div>' +
      seg("New words", "newWordsPerDay", [[1, "1"], [2, "2"], [3, "3"]]) +
      seg("Reviews", "reviewsPerDay", [[1, "1"], [2, "2"], [3, "3"], [5, "5"]]) +
      seg("Asking", "direction", [["adaptive", "Adaptive"], ["both", "Both"],
                                  ["id_en", "ID\u2192EN"], ["en_id", "EN\u2192ID"]]) +

      '<div class="label label-quiet" style="margin-top:22px">Storage</div>' +
      storageBlock() +

      '<div class="meta" style="margin-top:22px">Day ' + st.dayNumber + ' \u00b7 ' +
        st.introduced + ' words in progress \u00b7 ' + st.known + ' parked.<br>' +
        'A changed daily load takes effect tomorrow.</div>' +
      '<div style="margin-top:18px"><button class="btn btn-danger btn-sm" id="reset">Reset all progress</button></div>' +
    '</div>';

  act('<button class="btn btn-primary" id="back">Done</button>');
  document.getElementById("back").onclick = () => { rebuild(); render(); };

  stage.querySelectorAll("#sw .sw").forEach(b => b.onclick = () => {
    STATE.settings.accentPreset = b.dataset.k;
    save(); applyAccent(); settings();
  });
  stage.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    const key = b.dataset.key;
    let v = b.dataset.v;
    if (/^\d+$/.test(v)) v = +v;
    STATE.settings[key] = v;
    save();
    // Today's plan is left alone on purpose: rebuilding it would throw away the
    // answers already recorded against it. A changed load starts tomorrow.
    settings();
  });

  const pairBtn = document.getElementById("pair");
  if (pairBtn) pairBtn.onclick = async () => {
    const endpoint = document.getElementById("ep").value.trim();
    const token = document.getElementById("tk").value.trim();
    const profile = document.getElementById("who").value.trim();
    const msg = document.getElementById("pairmsg");
    if (!endpoint || !token) { msg.textContent = "Both the URL and the token are needed."; return; }
    pairBtn.disabled = true;
    msg.textContent = "Checking\u2026";
    const keep = SHEET;
    SHEET = { endpoint: endpoint, token: token, profile: profile };
    try {
      await sheetCall("ping", {});
      const remote = await sheetPull();
      writeSheetCreds(SHEET);
      sheetState = "ok";
      if (remote && newer(remote, STATE)) { STATE = merge(remote); applyAccent(); }
      else await sheetPush(STATE);
      settings();
    } catch (e) {
      SHEET = keep;
      pairBtn.disabled = false;
      msg.textContent = "Could not reach that backend \u2014 check the URL and token.";
    }
  };

  const unpair = document.getElementById("unpair");
  if (unpair) unpair.onclick = () => {
    writeSheetCreds(null);
    sheetState = "off";
    settings();
  };

  document.getElementById("reset").onclick = function () {
    if (this.dataset.armed !== "1") {
      this.dataset.armed = "1";
      this.textContent = "Tap again to erase everything";
      return;
    }
    const keep = STATE.settings;
    STATE = defaultState();
    STATE.settings = keep;
    save();
    skipped = 0;
    start();
  };
}

// Where this copy saves, and how to point it at the gym app's spreadsheet.
function storageBlock() {
  // Inside claude.ai the account store is the backend; the Sheet pairing is for
  // the installed build, which has no account behind it.
  if (!SHEET && typeof claude !== "undefined")
    return '<div class="meta">Saved to your Claude account. It follows you to any ' +
           'device where you open this page signed in.</div>';
  if (DB) return '<div class="meta">Saved to your Claude account. It follows you to ' +
                 'any device where you open this page signed in.</div>';
  if (SHEET) {
    const word = sheetState === "error" ? "not reachable right now"
               : sheetState === "saving" ? "saving\u2026" : "in sync";
    return '<div class="set"><label>Google Sheet</label>' +
           '<span class="meta">' + word + '</span></div>' +
           (SHEET.profile ? '<div class="set"><label>Profile</label>' +
             '<span class="meta">' + esc(SHEET.profile) + '</span></div>' : '') +
           '<div class="meta" style="margin-top:10px">Progress is written to the same ' +
           'spreadsheet as NXT, under its own tab. This device also keeps a copy, so the ' +
           'app works offline.</div>' +
           '<div style="margin-top:12px"><button class="btn btn-ghost btn-sm" id="unpair">Disconnect</button></div>';
  }
  return '<div class="meta">Saved on this device only. Connect it to the spreadsheet ' +
         'NXT already uses and your progress survives a new phone.</div>' +
         '<div class="pair">' +
           '<input class="input" id="ep" type="url" inputmode="url" autocomplete="off" ' +
             'placeholder="Apps Script web app URL">' +
           '<input class="input" id="tk" type="text" autocomplete="off" placeholder="App token">' +
           '<input class="input" id="who" type="text" autocomplete="off" ' +
             'placeholder="Your name (keeps progress separate)">' +
           '<button class="btn btn-primary btn-sm" id="pair">Connect</button>' +
           '<div class="meta" id="pairmsg"></div>' +
         '</div>';
}

function seg(label, key, pairs) {
  const cur = STATE.settings[key];
  return '<div class="set"><label>' + label + '</label><div class="seg">' +
    pairs.map(p => '<button data-key="' + key + '" data-v="' + p[0] + '" aria-pressed="' +
      (String(cur) === String(p[0]) ? "true" : "false") + '">' + p[1] + '</button>').join("") +
    '</div></div>';
}

// iOS reads the Home Screen icon and app name from <head> at the moment you tap
// "Add to Home Screen", and the page body is not where it looks — so the tags
// are copied up on load.
// Launched from the Home Screen there is no browser chrome above the page, so
// the layout has to make room for the status bar itself.
(function standaloneLayout() {
  try {
    const installed = navigator.standalone === true ||
      (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (installed) document.documentElement.classList.add("standalone");
  } catch (e) {}
})();

(function homeScreenIcon() {
  try {
    const want = [
      ["link", { rel: "apple-touch-icon", href: "icon/apple-touch-icon.png" }],
      ["link", { rel: "icon", href: "icon/icon-192.png" }],
      ["meta", { name: "apple-mobile-web-app-title", content: "Kata Satu" }],
      ["meta", { name: "apple-mobile-web-app-capable", content: "yes" }],
      ["meta", { name: "apple-mobile-web-app-status-bar-style", content: "black" }],
      ["meta", { name: "theme-color", content: "#09090A" }]
    ];
    for (const [tag, attrs] of want) {
      const el = document.createElement(tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      document.head.appendChild(el);
    }
  } catch (e) {}
})();

boot();

</script>
